<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARBLE RUSH™ — Physics V4</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--orange:#ff5a00;--yellow:#ffbd00;--cyan:#00dfd8;--dark:#080b12}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:var(--dark);color:#fff;font-family:Arial,Helvetica,sans-serif}
.hidden{display:none!important}
#backdrop{position:fixed;inset:-3%;background:center/cover;filter:brightness(.5) saturate(1.15);transform:scale(1.05)}
#shade{position:fixed;inset:0;background:radial-gradient(circle at center,transparent 25%,rgba(0,0,0,.58) 100%),linear-gradient(180deg,rgba(0,0,0,.3),transparent 40%,rgba(0,0,0,.5))}
#canvas{position:fixed;inset:0}
header{position:fixed;top:0;left:0;right:0;z-index:20;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(0,0,0,.82),transparent)}
.logo{font-size:24px;font-weight:1000}.logo span{color:var(--orange)}
.badge{font-size:11px;color:var(--cyan);font-weight:900}
#menu{position:fixed;z-index:15;inset:0;display:flex;align-items:center;justify-content:center;padding:18px}
.panel{width:min(760px,100%);background:rgba(14,18,27,.86);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:25px}
h1{font-size:clamp(38px,7vw,70px);line-height:.95;margin:0 0 10px;text-transform:uppercase}
p{color:#b9c2d1}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0}
.level{border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:12px;background:rgba(255,255,255,.06);color:#fff;font-weight:900;cursor:pointer}
.level.active{background:linear-gradient(90deg,var(--orange),var(--yellow));color:#060606}
.primary{width:100%;border:0;border-radius:14px;padding:15px;background:linear-gradient(90deg,var(--orange),var(--yellow));font-size:18px;font-weight:1000;cursor:pointer}
#countdown{position:fixed;z-index:40;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);font-size:clamp(100px,22vw,230px);font-weight:1000;text-shadow:0 0 50px var(--orange)}
#board{position:fixed;z-index:25;top:75px;right:15px;width:250px;padding:13px;border-radius:17px;background:rgba(11,14,21,.83);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.13)}
.row{display:grid;grid-template-columns:24px 12px 1fr auto;gap:8px;padding:7px 0;border-top:1px solid rgba(255,255,255,.06);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%}
#hud{position:fixed;z-index:25;left:15px;bottom:15px;display:flex;gap:8px;flex-wrap:wrap}
#hud button{border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:10px 13px;background:rgba(11,14,21,.82);color:#fff;cursor:pointer}
#event{position:fixed;z-index:26;top:80px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:rgba(11,14,21,.86);border:1px solid rgba(255,184,0,.32);font-weight:900}
#podium{position:fixed;z-index:50;inset:0;background:rgba(0,0,0,.76);display:flex;align-items:center;justify-content:center;padding:20px}
.podiumCard{width:min(650px,100%);background:rgba(15,19,28,.96);border:1px solid rgba(255,90,0,.35);border-radius:24px;padding:25px;text-align:center}
.podiumGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.place{padding:18px;border-radius:16px;background:rgba(255,255,255,.06)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.actions button{border:0;border-radius:12px;padding:12px 16px;font-weight:1000;cursor:pointer}.actions .primaryBtn{background:linear-gradient(90deg,var(--orange),var(--yellow))}.actions .secondary{background:rgba(255,255,255,.1);color:white}
@media(max-width:700px){.levels{grid-template-columns:repeat(2,1fr)}#board{width:210px}.podiumGrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="backdrop"></div><div id="shade"></div><div id="canvas"></div>
<header><div class="logo">MARBLE RUSH<span>™</span></div><div class="badge">PHYSICS V4 • CANNON-ES</div></header>

<section id="menu">
  <div class="panel">
    <div style="color:var(--orange);font-size:12px;font-weight:900;letter-spacing:.16em">FÍSICA REAL</div>
    <h1>Escolhe a pista</h1>
    <p>Agora os berlindes têm gravidade, colisões, saltos, quedas, checkpoints e respawn.</p>
    <div class="levels" id="levelButtons"></div>
    <button class="primary" id="startBtn">INICIAR CORRIDA</button>
  </div>
</section>

<div id="countdown" class="hidden">3</div>
<div id="event" class="hidden">⚡ EVENTO</div>
<aside id="board" class="hidden"><b>🏁 CLASSIFICAÇÃO</b><div id="rows"></div></aside>
<div id="hud" class="hidden">
  <button id="camFollow">🎥 Seguir líder</button>
  <button id="camTop">🗺️ Superior</button>
  <button id="soundBtn">🔊 Som</button>
  <button id="resetBtn">↻ Reiniciar</button>
</div>

<div id="podium" class="hidden">
  <div class="podiumCard">
    <div style="color:var(--cyan);font-weight:900">CORRIDA CONCLUÍDA</div>
    <h1>Pódio</h1>
    <div class="podiumGrid" id="podiumGrid"></div>
    <div class="actions">
      <button class="primaryBtn" id="replayBtn">CORRER NOVAMENTE</button>
      <button class="secondary" id="menuBtn">MENU</button>
    </div>
  </div>
</div>

<script type="module">
import * as CANNON from "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js";

const levels=[
 {id:1,title:"Cozinha Crocante",img:"assets/cozinha.jpg",track:0xff5500,gravity:-9.82,friction:.32,event:"🍞 TORRADA TURBO"},
 {id:2,title:"Castelo dos Dragões",img:"assets/castelo.jpg",track:0x7c3aed,gravity:-10.2,friction:.38,event:"🐉 SOPRO DO DRAGÃO"},
 {id:3,title:"Vulcão Infernal",img:"assets/vulcao.jpg",track:0xff2400,gravity:-11.2,friction:.24,event:"🌋 ERUPÇÃO"},
 {id:4,title:"Órbita Zero",img:"assets/orbita.jpg",track:0x00dfd8,gravity:-3.2,friction:.15,event:"🌀 PORTAL GRAVITACIONAL"}
];

let currentLevel=1,scene,camera,renderer,world,clock;
let racers=[],trackObjects=[],checkpoints=[],finishOrder=[];
let running=false,cameraMode="follow",raceStart=0,lastEvent=0;
let audioCtx=null,soundEnabled=true;

const names=["Turbo","Neon","Fénix","Vortex","Cometa","Nitro","Solar","Pixel","Blaze","Echo","Rocket","Nova"];
const colors=[0x00dfd8,0xff5500,0xffb800,0x7928ca,0x00ff66,0xff0055];

function initAudio(){
  if(audioCtx)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(AC)audioCtx=new AC();
}
function tone(freq,duration=.14,type="sine",vol=.2,slide=0){
  if(!soundEnabled)return;initAudio();if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;
  o.type=type;o.frequency.setValueAtTime(freq,now);if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,freq+slide),now+duration);
  g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.001,now+duration);
  o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+duration);
}
function noise(duration=.15,vol=.06){
  if(!soundEnabled)return;initAudio();if(!audioCtx)return;
  const len=Math.floor(audioCtx.sampleRate*duration),buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=audioCtx.createBufferSource(),g=audioCtx.createGain();g.gain.value=vol;s.buffer=buf;s.connect(g);g.connect(audioCtx.destination);s.start();
}

function renderLevels(){
  levelButtons.innerHTML=levels.map(l=>`<button class="level ${l.id===currentLevel?"active":""}" data-id="${l.id}">🏁 ${l.id}<br>${l.title}</button>`).join("");
  levelButtons.querySelectorAll("button").forEach(b=>b.onclick=()=>{currentLevel=Number(b.dataset.id);renderLevels();backdrop.style.backgroundImage=`url('${levels[currentLevel-1].img}')`});
}
renderLevels();
backdrop.style.backgroundImage=`url('${levels[0].img}')`;

function initScene(){
  const l=levels[currentLevel-1];
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);camera.position.set(0,28,48);
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setClearColor(0x000000,0);renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  canvas.innerHTML="";canvas.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,.72));
  const sun=new THREE.DirectionalLight(0xffb800,1.5);sun.position.set(20,45,20);scene.add(sun);
  scene.add(new THREE.PointLight(l.track,3,60));

  world=new CANNON.World({gravity:new CANNON.Vec3(0,l.gravity,0)});
  world.broadphase=new CANNON.SAPBroadphase(world);
  world.allowSleep=true;
  world.defaultContactMaterial.friction=l.friction;
  world.defaultContactMaterial.restitution=.18;

  clock=new THREE.Clock();
  buildTrack();
  spawnRacers();
  addEventListener("resize",resize);
}

function addStaticBox(size,pos,rot={x:0,y:0,z:0},color=0x333333,opacity=1){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(...size),new THREE.MeshStandardMaterial({color,transparent:opacity<1,opacity}));
  mesh.position.set(...pos);mesh.rotation.set(rot.x||0,rot.y||0,rot.z||0);scene.add(mesh);
  const body=new CANNON.Body({mass:0,shape:new CANNON.Box(new CANNON.Vec3(size[0]/2,size[1]/2,size[2]/2))});
  body.position.set(...pos);body.quaternion.setFromEuler(rot.x||0,rot.y||0,rot.z||0);world.addBody(body);
  trackObjects.push({mesh,body});
  return {mesh,body};
}

function buildTrack(){
  const l=levels[currentLevel-1];
  trackObjects=[];checkpoints=[];

  const sections=[
    {s:[18,1.2,8],p:[-28,17,-14],r:{z:-.12}},
    {s:[18,1.2,8],p:[-13,13,-18],r:{y:.35,z:-.2}},
    {s:[16,1.2,7],p:[1,9,-12],r:{y:-.25,z:-.18}},
    {s:[16,1.2,7],p:[13,5,-3],r:{y:.45,z:-.22}},
    {s:[17,1.2,7],p:[5,1,10],r:{y:-.45,z:-.18}},
    {s:[18,1.2,8],p:[20,-3,18],r:{y:.15,z:-.08}}
  ];

  sections.forEach((sec,i)=>{
    addStaticBox(sec.s,sec.p,sec.r,l.track,.9);
    // Side walls
    const wallColor=0xffffff;
    addStaticBox([sec.s[0],2.3,.35],[sec.p[0],sec.p[1]+1.4,sec.p[2]-sec.s[2]/2],sec.r,wallColor,.58);
    addStaticBox([sec.s[0],2.3,.35],[sec.p[0],sec.p[1]+1.4,sec.p[2]+sec.s[2]/2],sec.r,wallColor,.58);
    checkpoints.push({x:sec.p[0],y:sec.p[1]+2,z:sec.p[2],index:i});
  });

  // Jump ramp
  addStaticBox([8,1,7],[7,7,-7],{z:.23,y:.1},0xffb800,.95);

  // Rotating obstacle
  const obstacle=addStaticBox([10,.7,.7],[11,8,-2],{},0xff2d55,.95);
  obstacle.body.type=CANNON.Body.KINEMATIC;
  obstacle.body.updateMassProperties();
  obstacle.mesh.userData.rotator=true;

  // Finish gate
  addStaticBox([.6,7,10],[29,-1,20],{},0x00ff88,.65);
}

function spawnRacers(){
  racers=[];finishOrder=[];
  for(let i=0;i<12;i++){
    const mesh=new THREE.Mesh(new THREE.SphereGeometry(.82,20,20),new THREE.MeshStandardMaterial({color:colors[i%colors.length],metalness:.92,roughness:.08}));
    scene.add(mesh);
    const body=new CANNON.Body({mass:1,shape:new CANNON.Sphere(.82),linearDamping:.08,angularDamping:.08});
    body.position.set(-35+i*.45,22+(i%3)*.2,-14+(i%4)*.45);
    body.velocity.set(7+Math.random()*2,-1,0);
    body.material=new CANNON.Material({friction:levels[currentLevel-1].friction,restitution:.25});
    world.addBody(body);
    racers.push({mesh,body,name:names[i],finished:false,time:0,lastCheckpoint:0,respawns:0});
  }
}

function countdownStart(){
  menu.classList.add("hidden");board.classList.remove("hidden");hud.classList.remove("hidden");countdown.classList.remove("hidden");
  let seq=["3","2","1","RUSH!"],i=0;countdown.textContent=seq[0];tone(320);
  const timer=setInterval(()=>{i++;if(i<seq.length){countdown.textContent=seq[i];seq[i]==="RUSH!"?tone(220,.4,"sawtooth",.35,600):tone(320)}else{clearInterval(timer);countdown.classList.add("hidden");raceStart=performance.now();running=true}},780);
}

function updatePhysics(){
  const dt=Math.min(clock.getDelta(),.033);
  world.step(1/60,dt,3);

  trackObjects.forEach(o=>{
    if(o.mesh.userData.rotator){
      const a=performance.now()*.0018;
      o.body.quaternion.setFromEuler(0,a,0);
    }
    o.mesh.position.copy(o.body.position);o.mesh.quaternion.copy(o.body.quaternion);
  });

  racers.forEach(r=>{
    r.mesh.position.copy(r.body.position);r.mesh.quaternion.copy(r.body.quaternion);

    // downhill assistance
    if(running&&!r.finished)r.body.applyForce(new CANNON.Vec3(8,0,0),r.body.position);

    // checkpoint detection
    checkpoints.forEach(cp=>{
      const dx=r.body.position.x-cp.x,dz=r.body.position.z-cp.z;
      if(Math.hypot(dx,dz)<8&&cp.index>=r.lastCheckpoint)r.lastCheckpoint=cp.index;
    });

    // finish line
    if(!r.finished&&r.body.position.x>27&&r.body.position.z>12){
      r.finished=true;r.time=performance.now()-raceStart;finishOrder.push(r);tone(520+finishOrder.length*90,.22,"triangle",.2);
      if(finishOrder.length===3)finishRace();
    }

    // fall + respawn
    if(!r.finished&&r.body.position.y<-18){
      const cp=checkpoints[Math.min(r.lastCheckpoint,checkpoints.length-1)];
      r.body.position.set(cp.x,cp.y+4,cp.z);
      r.body.velocity.set(4,0,0);r.body.angularVelocity.set(0,0,0);r.respawns++;
      noise(.18,.05);
      showEvent(`↻ ${r.name} regressou ao checkpoint`);
    }
  });
}

function updateBoard(){
  const sorted=[...racers].sort((a,b)=>{
    if(a.finished&&b.finished)return a.time-b.time;
    if(a.finished)return -1;if(b.finished)return 1;
    return b.lastCheckpoint-a.lastCheckpoint || b.body.position.x-a.body.position.x;
  });
  rows.innerHTML=sorted.slice(0,8).map((r,i)=>`<div class="row"><span>${i+1}</span><span class="dot" style="background:#${r.mesh.material.color.getHexString()}"></span><b>${r.name}</b><span style="color:var(--cyan)">${r.finished?"FINISH":"CP "+(r.lastCheckpoint+1)}</span></div>`).join("");
}

function updateCamera(){
  if(!racers.length)return;
  const leader=[...racers].filter(r=>!r.finished).sort((a,b)=>b.lastCheckpoint-a.lastCheckpoint||b.body.position.x-a.body.position.x)[0]||finishOrder[0];
  if(cameraMode==="follow"&&leader){
    const p=leader.mesh.position;
    camera.position.x=THREE.MathUtils.lerp(camera.position.x,p.x+15,.06);
    camera.position.y=THREE.MathUtils.lerp(camera.position.y,p.y+10,.06);
    camera.position.z=THREE.MathUtils.lerp(camera.position.z,p.z+18,.06);
    camera.lookAt(p);
  }
}

function maybeEvent(){
  if(!running||performance.now()-lastEvent<4200)return;
  lastEvent=performance.now();showEvent(levels[currentLevel-1].event);tone(180,.35,"sawtooth",.16,220);
  racers.forEach(r=>{if(!r.finished)r.body.applyImpulse(new CANNON.Vec3(2,(Math.random()-.5)*2,(Math.random()-.5)*2),r.body.position)});
}

function showEvent(text){event.textContent=text;event.classList.remove("hidden");clearTimeout(showEvent.t);showEvent.t=setTimeout(()=>event.classList.add("hidden"),1500)}

function finishRace(){
  running=false;
  podiumGrid.innerHTML=finishOrder.slice(0,3).map((r,i)=>`<div class="place"><div style="font-size:34px">${["🥇","🥈","🥉"][i]}</div><b>${r.name}</b><div>${(r.time/1000).toFixed(2)}s</div><small>${r.respawns} respawn(s)</small></div>`).join("");
  tone(523,.25,"triangle",.2);setTimeout(()=>tone(659,.25,"triangle",.2),120);setTimeout(()=>tone(784,.4,"triangle",.22),240);
  setTimeout(()=>podium.classList.remove("hidden"),500);
}

function animate(){
  requestAnimationFrame(animate);
  if(world){updatePhysics();updateCamera();updateBoard();maybeEvent();renderer.render(scene,camera)}
}
animate();

function startGame(){initAudio();backdrop.style.backgroundImage=`url('${levels[currentLevel-1].img}')`;initScene();countdownStart()}
function restart(){podium.classList.add("hidden");running=false;initScene();countdownStart()}
function backMenu(){running=false;podium.classList.add("hidden");board.classList.add("hidden");hud.classList.add("hidden");menu.classList.remove("hidden")}
function resize(){if(!camera||!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}

startBtn.onclick=startGame;
replayBtn.onclick=restart;
menuBtn.onclick=backMenu;
camFollow.onclick=()=>cameraMode="follow";
camTop.onclick=()=>{cameraMode="top";camera.position.set(0,65,.1);camera.lookAt(0,0,0)};
resetBtn.onclick=restart;
soundBtn.onclick=()=>{soundEnabled=!soundEnabled;soundBtn.textContent=soundEnabled?"🔊 Som":"🔇 Som"};
</script>
</body>
</html>
