<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARBLE RUSH™ — World Hub</title>
<style>
:root{--orange:#ff5a00;--yellow:#ffbd00;--cyan:#00dfd8;--panel:rgba(10,14,23,.88);--line:rgba(255,255,255,.13)}
*{box-sizing:border-box}
body{margin:0;background:#07111b;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
button{font:inherit}
#world{position:fixed;inset:0;background:url("assets/world-map.png") center/cover no-repeat;transform-origin:center;transition:transform .7s ease,filter .4s ease}
#shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 35%,rgba(0,0,0,.35));pointer-events:none}
header{position:fixed;z-index:20;top:0;left:0;right:0;padding:13px 18px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(5,8,14,.9),rgba(5,8,14,.15))}
.logo{font-size:27px;font-weight:1000;text-shadow:0 4px 18px #000}.logo span{color:var(--orange)}
.resources{display:flex;gap:10px;flex-wrap:wrap}.resource{padding:9px 13px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:900}
#sidebar{position:fixed;z-index:21;left:14px;top:86px;display:flex;flex-direction:column;gap:9px}
.sideBtn{width:64px;min-height:62px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:#fff;font-size:11px;font-weight:900;cursor:pointer}
.sideBtn span{display:block;font-size:24px;margin-bottom:3px}
#profile{position:fixed;z-index:21;left:16px;bottom:16px;width:305px;padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:19px;backdrop-filter:blur(14px)}
.profileTop{display:flex;gap:12px;align-items:center}.avatar{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#4169e1 25%,#10094a 70%);border:3px solid #fff}
.levelBar{height:8px;background:#262d3d;border-radius:99px;overflow:hidden;margin-top:10px}.levelBar div{height:100%;width:81%;background:linear-gradient(90deg,var(--orange),var(--yellow))}
#raceButton{position:fixed;z-index:22;left:50%;bottom:17px;transform:translateX(-50%);padding:17px 55px;border:0;border-radius:22px;background:linear-gradient(180deg,#65c526,#339a0c);color:white;font-size:27px;font-weight:1000;cursor:pointer;box-shadow:0 12px 35px rgba(30,120,10,.45)}
#raceButton small{display:block;font-size:11px;letter-spacing:.08em}
#reward{position:fixed;z-index:21;right:16px;bottom:16px;padding:15px 18px;background:var(--panel);border:1px solid var(--line);border-radius:19px;min-width:235px}
.rewardBar{height:7px;background:#252b39;border-radius:99px;overflow:hidden;margin-top:9px}.rewardBar div{height:100%;width:93%;background:linear-gradient(90deg,var(--yellow),var(--orange))}
.hotspot{position:absolute;z-index:12;transform:translate(-50%,-50%);border:0;border-radius:15px;padding:9px 13px;background:rgba(5,9,16,.88);color:white;font-weight:1000;cursor:pointer;border:1px solid rgba(255,255,255,.18);box-shadow:0 8px 25px rgba(0,0,0,.4);transition:.25s}
.hotspot:hover{transform:translate(-50%,-50%) scale(1.08);border-color:var(--yellow)}
.hotspot small{display:block;color:var(--yellow);margin-top:3px}
#zonePanel{position:fixed;z-index:40;right:-430px;top:0;bottom:0;width:min(420px,100%);background:rgba(8,12,20,.96);backdrop-filter:blur(20px);border-left:1px solid var(--line);transition:right .4s ease;padding:24px;overflow:auto}
#zonePanel.open{right:0}
.zoneHero{height:235px;border-radius:20px;background:center/cover;margin-bottom:18px;position:relative;overflow:hidden}
.zoneHero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.75))}
.zoneHero h2{position:absolute;z-index:2;left:18px;right:18px;bottom:16px;margin:0;font-size:32px;text-transform:uppercase}
.close{position:absolute;right:16px;top:16px;z-index:3;border:0;border-radius:11px;padding:9px 12px;background:rgba(0,0,0,.5);color:white;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:rgba(255,255,255,.06);border:1px solid var(--line);padding:12px;border-radius:13px;text-align:center}
.stat label{display:block;color:#aeb7c8;font-size:10px}.stat b{font-size:18px}
.mission{padding:13px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin-top:9px}
.enter{width:100%;margin-top:18px;border:0;border-radius:15px;padding:15px;background:linear-gradient(90deg,var(--orange),var(--yellow));font-weight:1000;cursor:pointer}
#transition{display:none;position:fixed;z-index:70;inset:0;background:#05070b;align-items:center;justify-content:center;text-align:center}
#transition.show{display:flex}
.portal{width:210px;height:210px;border-radius:50%;border:12px solid var(--cyan);box-shadow:0 0 70px var(--cyan),inset 0 0 55px var(--cyan);animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.transitionText{position:absolute;font-size:33px;font-weight:1000;text-transform:uppercase;text-shadow:0 5px 20px #000}
@media(max-width:760px){.resources{display:none}#sidebar{left:7px;top:75px}.sideBtn{width:54px;min-height:54px}#profile{width:230px}.hotspot{font-size:11px;padding:7px 9px}#reward{display:none}#raceButton{padding:14px 34px;font-size:22px}}
</style>
</head>
<body>
<div id="world"></div><div id="shade"></div>
<header><div class="logo">MARBLE RUSH<span>™</span> WORLD</div><div class="resources"><div class="resource">⭐ 135/180</div><div class="resource">🪙 12.450</div><div class="resource">💎 850</div></div></header>
<div id="sidebar"><button class="sideBtn"><span>🎯</span>MISSÕES</button><button class="sideBtn"><span>🎁</span>EVENTOS</button><button class="sideBtn"><span>📋</span>DIÁRIO</button><button class="sideBtn"><span>🏆</span>RANKING</button></div>
<div id="profile"><div class="profileTop"><div class="avatar"></div><div><b style="font-size:18px">PedroF</b><div style="color:#b9c2d1">NÍVEL 25</div></div></div><div class="levelBar"><div></div></div><small>3.250 / 4.000 XP</small></div>
<button id="raceButton" onclick="openRandomZone()">🏁 CORRER<small>ESCOLHE UMA PISTA</small></button>
<div id="reward"><b>PRÓXIMA RECOMPENSA</b><div class="rewardBar"><div></div></div><small>⭐ 140 / 150</small></div>
<div id="hotspots"></div>
<aside id="zonePanel"><button class="close" onclick="closeZone()">✕</button><div class="zoneHero" id="zoneHero"><h2 id="zoneTitle"></h2></div><p id="zoneDesc"></p><div class="stats"><div class="stat"><label>ESTRELAS</label><b id="zoneStars"></b></div><div class="stat"><label>PISTAS</label><b id="zoneTracks"></b></div><div class="stat"><label>DIFICULDADE</label><b id="zoneDiff"></b></div></div><h3>MISSÕES DA ZONA</h3><div id="missions"></div><button class="enter" onclick="enterZone()">ENTRAR NO PORTAL</button></aside>
<div id="transition"><div class="portal"></div><div class="transitionText" id="transitionText">A ENTRAR...</div></div>
<script>
const zones=[
{name:"Praia Dourada",x:13,y:42,stars:"15/15",tracks:5,diff:"Fácil",desc:"Corridas costeiras, faróis, pontes de madeira e ondas gigantes.",missions:["Termina sem cair","Apanha 5 moedas","Vence em menos de 2:30"]},
{name:"Bairro Residencial",x:36,y:28,stars:"18/18",tracks:6,diff:"Fácil",desc:"Jardins, garagens, piscinas e telhados transformados em pistas.",missions:["Usa 2 atalhos","Vence com Turbo","Encontra o berlinde dourado"]},
{name:"Centro da Cidade",x:49,y:20,stars:"21/24",tracks:8,diff:"Média",desc:"Arranha-céus, metro, obras e trânsito em plena hora de ponta.",missions:["Sem respawn","Faz 3 ultrapassagens","Termina no pódio"]},
{name:"Fábrica Mecânica",x:65,y:25,stars:"16/21",tracks:7,diff:"Alta",desc:"Tapetes rolantes, prensas, caixas, robots e máquinas gigantes.",missions:["Evita as prensas","Usa a rota secreta","Vence 2 vezes"]},
{name:"Monte Vulcão",x:85,y:32,stars:"12/15",tracks:5,diff:"Extrema",desc:"Lava, rochas em queda, pontes instáveis e erupções imprevisíveis.",missions:["Sobrevive à erupção","Zero quedas","Tempo inferior a 3:00"]},
{name:"Restaurante",x:28,y:53,stars:"18/18",tracks:6,diff:"Média",desc:"Cozinhas, torradeiras, cereais, lava-loiça e sobremesas gigantes.",missions:["Atalho da torradeira","Apanha 20 cereais","Chega em primeiro"]},
{name:"Parque Verde",x:48,y:48,stars:"15/18",tracks:6,diff:"Média",desc:"Lagos, escorregas, árvores gigantes e pontes suspensas.",missions:["Salta sobre o lago","Sem colisões","Apanha 3 folhas raras"]},
{name:"Laboratório",x:66,y:51,stars:"14/18",tracks:6,diff:"Alta",desc:"Portais, experiências, gravidade alterada e energia instável.",missions:["Usa 3 portais","Evita o laser","Vence em gravidade zero"]},
{name:"Castelo dos Dragões",x:86,y:51,stars:"12/24",tracks:8,diff:"Extrema",desc:"Muralhas, catapultas, fogo, masmorras e dragões.",missions:["Escapa ao dragão","Abre a ponte","Encontra a masmorra"]},
{name:"Aeroporto",x:20,y:76,stars:"10/15",tracks:5,diff:"Alta",desc:"Pistas de aviação, hangares, bagagens e turbinas perigosas.",missions:["Evita a turbina","Apanha a mala dourada","Vence no hangar"]},
{name:"Porto Marítimo",x:76,y:77,stars:"12/15",tracks:5,diff:"Alta",desc:"Contentores, navios, gruas e plataformas sobre o mar.",missions:["Salta 4 contentores","Sem cair na água","Usa a grua secreta"]}
];
let selectedZone=null;
function renderHotspots(){document.getElementById("hotspots").innerHTML=zones.map((z,i)=>`<button class="hotspot" style="left:${z.x}%;top:${z.y}%" onclick="openZone(${i})">${z.name}<small>⭐ ${z.stars}</small></button>`).join("")}
function openZone(i){selectedZone=zones[i];zoneTitle.textContent=selectedZone.name;zoneDesc.textContent=selectedZone.desc;zoneStars.textContent=selectedZone.stars;zoneTracks.textContent=selectedZone.tracks;zoneDiff.textContent=selectedZone.diff;zoneHero.style.backgroundImage='url("assets/world-map.png")';zoneHero.style.backgroundPosition=`${selectedZone.x}% ${selectedZone.y}%`;missions.innerHTML=selectedZone.missions.map((m,j)=>`<div class="mission">${j+1}. ${m}</div>`).join("");zonePanel.classList.add("open");world.style.transform=`scale(1.08) translate(${50-selectedZone.x}%,${50-selectedZone.y}%)`;world.style.filter="brightness(.72)"}
function closeZone(){zonePanel.classList.remove("open");world.style.transform="scale(1)";world.style.filter="none"}
function openRandomZone(){openZone(Math.floor(Math.random()*zones.length))}
function enterZone(){if(!selectedZone)return;transitionText.textContent=`A ENTRAR EM ${selectedZone.name}`;transition.classList.add("show");setTimeout(()=>{transitionText.textContent="PORTAL ABERTO";setTimeout(()=>{transition.classList.remove("show");alert(`${selectedZone.name}: portal pronto para ligar à pista jogável.`)},900)},1300)}
renderHotspots();
</script>
</body>
</html>
